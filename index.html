<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeraBox Shared Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding: 20px; }
        .container { max-width: 800px; }
    </style>
</head>
<body>

<div class="container bg-white p-4 rounded shadow-sm">
    <h3 class="text-primary mb-3">TeraBox Shared File Manager</h3>
    <p class="text-muted small">Cấu hình hệ thống đã được lưu sẵn. Mọi thiết bị truy cập đều có thể dùng ngay.</p>

    <!-- Khối Upload -->
    <div class="card mb-4 border-primary">
        <div class="card-body">
            <h5 class="card-title">Tải File Lên TeraBox</h5>
            <div class="input-group">
                <input type="file" id="fileInput" class="form-control">
                <button class="btn btn-primary" onclick="uploadFile()">Upload</button>
            </div>
            <div id="status" class="mt-2 text-info fw-bold"></div>
        </div>
    </div>

    <!-- Khối Danh sách File -->
    <div class="d-flex justify-content-between align-items-center mb-2">
        <h5 class="m-0">Danh sách Tập tin</h5>
        <button class="btn btn-outline-secondary btn-sm" onclick="loadFiles()">Cập nhật danh sách</button>
    </div>

    <table class="table table-bordered table-hover align-middle">
        <thead class="table-dark">
            <tr>
                <th>Tên File</th>
                <th>Kích thước</th>
                <th>Hành động</th>
            </tr>
        </thead>
        <tbody id="fileList">
            <tr><td colspan="3" class="text-center text-muted">Đang kết nối tới TeraBox...</td></tr>
        </tbody>
    </table>
</div>

<script>
    // =========================================================================
    // CẤU HÌNH CỐ ĐỊNH CHO TẤT CẢ THIẾT BỊ
    // =========================================================================
    const CONFIG = {
        // Dán mã NDUS Token lấy từ Cookie TeraBox vào đây
        NDUS_TOKEN: 'NDUS_TOKEN_CỦA_BẠN',

        // Dán URL Cloudflare Worker của bạn (hoặc giữ nguyên corsproxy.io)
        // Ví dụ: 'https://terabox-proxy.user.workers.dev/?url='
        PROXY_URL: 'https://corsproxy.io/?' 
    };

    // Hàm kiểm tra cấu hình
    function checkConfig() {
        if (CONFIG.NDUS_TOKEN === 'NDUS_TOKEN_CỦA_BẠN' || !CONFIG.NDUS_TOKEN) {
            alert('Vui lòng mở file index.html và điền NDUS_TOKEN thực tế của bạn!');
            throw new Error('Chưa cấu hình Token');
        }
    }

    // 1. Tải danh sách file
    async function loadFiles() {
        checkConfig();
        const tbody = document.getElementById('fileList');
        tbody.innerHTML = '<tr><td colspan="3" class="text-center">Đang tải dữ liệu...</td></tr>';

        try {
            const targetUrl = 'https://www.terabox.com/api/list?dir=/&order=time&desc=1';
            const requestUrl = CONFIG.PROXY_URL.includes('?url=') 
                ? CONFIG.PROXY_URL + encodeURIComponent(targetUrl)
                : CONFIG.PROXY_URL + targetUrl;

            const res = await fetch(requestUrl, {
                headers: { 'Cookie': `ndus=${CONFIG.NDUS_TOKEN};` }
            });
            const data = await res.json();

            if (!data.list || data.list.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" class="text-center">Thư mục trống</td></tr>';
                return;
            }

            tbody.innerHTML = data.list.map(f => `
                <tr>
                    <td>${f.server_filename}</td>
                    <td>${(f.size / (1024 * 1024)).toFixed(2)} MB</td>
                    <td>
                        <button class="btn btn-danger btn-sm" onclick="deleteFile('${f.path}')">Xóa</button>
                    </td>
                </tr>
            `).join('');
        } catch (err) {
            tbody.innerHTML = '<tr><td colspan="3" class="text-center text-danger">Lỗi kết nối. Kiểm tra lại Token hoặc Proxy!</td></tr>';
        }
    }

    // 2. Upload file
    async function uploadFile() {
        checkConfig();
        const fileInput = document.getElementById('fileInput');
        const status = document.getElementById('status');
        const file = fileInput.files[0];

        if (!file) return alert('Hãy chọn 1 file!');

        status.innerText = 'Đang khởi tạo tải lên...';

        try {
            const precreateUrl = 'https://www.terabox.com/api/precreate';
            const formData = new URLSearchParams({
                path: '/' + file.name,
                size: file.size,
                isdir: '0',
                autoinit: '1'
            });

            const preReqUrl = CONFIG.PROXY_URL.includes('?url=') 
                ? CONFIG.PROXY_URL + encodeURIComponent(precreateUrl)
                : CONFIG.PROXY_URL + precreateUrl;

            const preRes = await fetch(preReqUrl, {
                method: 'POST',
                headers: { 
                    'Cookie': `ndus=${CONFIG.NDUS_TOKEN};`,
                    'Content-Type': 'application/x-www-form-urlencoded' 
                },
                body: formData
            }).then(r => r.json());

            status.innerText = 'Đang lưu file vào tài khoản...';
            const createUrl = 'https://www.terabox.com/api/create';
            const createData = new URLSearchParams({
                path: '/' + file.name,
                size: file.size,
                isdir: '0',
                uploadid: preRes.uploadid || ''
            });

            const createReqUrl = CONFIG.PROXY_URL.includes('?url=') 
                ? CONFIG.PROXY_URL + encodeURIComponent(createUrl)
                : CONFIG.PROXY_URL + createUrl;

            await fetch(createReqUrl, {
                method: 'POST',
                headers: { 
                    'Cookie': `ndus=${CONFIG.NDUS_TOKEN};`,
                    'Content-Type': 'application/x-www-form-urlencoded' 
                },
                body: createData
            });

            status.innerText = 'Tải lên thành công!';
            fileInput.value = '';
            loadFiles();
        } catch (err) {
            status.innerText = 'Tải lên thất bại!';
        }
    }

    // 3. Xóa file
    async function deleteFile(filePath) {
        if (!confirm('Bạn có chắc muốn xóa file này?')) return;

        try {
            const url = 'https://www.terabox.com/api/filemanager?opera=delete';
            const bodyData = new URLSearchParams({
                filelist: JSON.stringify([filePath])
            });

            const delReqUrl = CONFIG.PROXY_URL.includes('?url=') 
                ? CONFIG.PROXY_URL + encodeURIComponent(url)
                : CONFIG.PROXY_URL + url;

            await fetch(delReqUrl, {
                method: 'POST',
                headers: { 
                    'Cookie': `ndus=${CONFIG.NDUS_TOKEN};`,
                    'Content-Type': 'application/x-www-form-urlencoded' 
                },
                body: bodyData
            });

            loadFiles();
        } catch (err) {
            alert('Xóa thất bại!');
        }
    }

    // Tự động tải danh sách file ngay khi mở trang
    window.onload = loadFiles;
</script>
</body>
</html>
